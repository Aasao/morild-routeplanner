name: weather-pack

# Værpakke-batchen (docs/specs/vaerpakker.md §5/§7/§16, ADR-0003): bygger en
# ekte MEPS-vindpakke fra THREDDS (`build-live`, bak §16-gaten i
# legal-gate.ts) og laster den opp til R2-speilet (`upload-r2`: blober
# først, peker sist, stikkprøver lest tilbake). Uten Cloudflare-secrets
# kjører jobben dry-run med en synlig advarsel.

on:
  schedule:
    # Hver 3. time: lagged-ensemblet publiseres ~2 t etter init og appen
    # kaller en pakke «for gammel» etter 6 t — 3 t kadens holder alderen
    # under ~5 t. Ett bygg er ~2 min sekvensielle THREDDS-kall (§16).
    - cron: "15 */3 * * *"
  workflow_dispatch:

concurrency:
  group: weather-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aktiver pnpm via corepack
        run: corepack enable
      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile
      # Kun pakkeverktøyets tester: rutemotorens tunge tester hører til CI
      # på push og skal ikke kunne stoppe ferske værdata.
      - name: Tester for værpakke-verktøyet
        run: pnpm exec vitest run tools/weather-pack
      - name: Mangler secrets — dry-run
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID mangler — ingen pakke publisert, kun dry-run."
          pnpm --filter @morild/weather-pack dry-run
      - name: Bygg ekte pakke fra THREDDS
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --filter @morild/weather-pack build-live
      - name: Last opp til R2 (blober, så peker) og verifiser
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --filter @morild/weather-pack upload-r2
